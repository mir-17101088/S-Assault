<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sexual Assault Cases in Bangladesh (2012-2025)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #161515;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative
    }

    #header {
      padding: 10px 16px 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-text {
      min-width: 0;
    }

    #header h1 {
      margin: 0;
      font-size: 16.5px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.1px;
      line-height: 1.3;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    #header .subtitle {
      margin: 3px 0 0;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.3
    }

    #map-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      padding: 0 2px
    }

    #map-wrap svg {
      display: block;
      width: 100%;
      height: 100%
    }

    #map-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(255, 30, 30, 0.02) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #footer {
      padding: 2px 16px 6px;
      flex-shrink: 0;
      font-size: 9.5px;
      color: rgba(255, 255, 255, 0.32);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .upazila {
      stroke: rgba(255, 255, 255, 0.16);
      stroke-width: 0.3;
      cursor: pointer;
      transition: stroke 0.2s ease, stroke-width 0.2s ease, opacity 0.4s ease, filter 0.3s ease;
    }

    .upazila.grp-hover,
    .upazila.tapped {
      filter: brightness(1.34) drop-shadow(0 0 6px rgba(255, 95, 70, 0.6));
    }

    .upazilas-group.view-upazila .upazila.grp-hover,
    .upazilas-group.view-upazila .upazila.tapped {
      stroke: #fff;
      stroke-width: 1.1;
      stroke-opacity: 1;
    }

    .upazila.dimmed {
      opacity: 0.08 !important;
      filter: none !important;
      transition: opacity 0.4s ease, filter 0.3s ease
    }

    .upazila.highlighted {
      filter: drop-shadow(0 0 3px rgba(200, 30, 30, 0.3));
      transition: opacity 0.4s ease, filter 0.3s ease
    }

    .division-border {
      fill: none;
      stroke: rgba(255, 255, 255, 0.32);
      stroke-width: 0.9;
      pointer-events: none;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    .district-border {
      fill: none;
      stroke: rgba(255, 255, 255, 0.13);
      stroke-width: 0.35;
      pointer-events: none;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    .division-label {
      font-size: 12px;
      font-weight: 800;
      fill: #fff;
      text-anchor: middle;
      pointer-events: none;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      paint-order: stroke;
      stroke: rgba(0, 0, 0, 0.7);
      stroke-width: 3.5px;
      stroke-linejoin: round;
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #222;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), 0 0 0 0.5px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 100;
      max-width: 250px;
    }

    #tooltip .tt-upazila {
      font-weight: 700;
      font-size: 16px;
      color: #111;
      margin-bottom: 2px;
      letter-spacing: -0.1px;
    }

    #tooltip .tt-loc {
      color: #5b5b5b;
      font-size: 11.5px;
      margin-bottom: 11px;
      font-weight: 400
    }

    #tooltip .tt-label {
      font-size: 9px;
      color: #8a2a2a;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 4px;
      font-weight: 700
    }

    #tooltip .tt-cases {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff5a4d, #c41616);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      display: inline;
    }

    #tooltip .tt-suffix {
      font-size: 12.5px;
      color: #777;
      font-weight: 500;
      margin-left: 5px;
      -webkit-text-fill-color: #777;
    }

    #legend {
      position: absolute;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .legend-title {
      font-size: 9px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 3px
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 11px 5px 9px;
      border-radius: 9px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      user-select: none;
    }

    .legend-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.18)
    }

    .legend-item.active {
      background: rgba(255, 70, 60, 0.16);
      border-color: rgba(255, 90, 75, 0.5);
      box-shadow: 0 0 14px rgba(255, 60, 50, 0.22);
    }

    .legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .legend-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      white-space: nowrap;
      font-weight: 500
    }

    .legend-count {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.42);
      margin-left: auto;
      padding-left: 8px;
      font-weight: 400
    }

    /* View-scoped strokes: aggregated views fade internal upazila seams */
    .upazilas-group.view-district .upazila {
      stroke-opacity: 0.16;
      stroke-width: 0.22;
    }

    .upazilas-group.view-division .upazila {
      stroke-opacity: 0.09;
      stroke-width: 0.15;
    }

    /* Border emphasis per view */
    .mode-district .district-border {
      stroke: rgba(255, 255, 255, 0.55);
      stroke-width: 0.7;
    }

    .mode-district .division-border {
      stroke: rgba(255, 255, 255, 0.85);
      stroke-width: 1.1;
    }

    .mode-division .district-border {
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 0.25;
    }

    .mode-division .division-border {
      stroke: #fff;
      stroke-width: 1.4;
    }

    /* View toggle segmented control */
    #view-toggle {
      flex-shrink: 0;
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    .view-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
      padding: 6px 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      font-family: inherit;
    }

    .view-btn:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .view-btn.active {
      background: linear-gradient(135deg, #e23b30, #b71c1c);
      color: #fff;
      box-shadow: 0 2px 8px rgba(200, 30, 30, 0.4);
    }

    @media (hover: none) and (pointer: coarse) {
      #tooltip {
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        top: auto !important;
        max-width: 100% !important;
        width: 100%;
        border-radius: 14px 14px 0 0 !important;
        padding: 18px 20px 22px;
        opacity: 1 !important;
        visibility: hidden;
        transform: translateY(105%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s !important;
        box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.5) !important;
      }

      #tooltip.show {
        transform: translateY(0);
        visibility: visible;
      }

      #tooltip .tt-upazila {
        font-size: 19px
      }

      #tooltip .tt-loc {
        font-size: 13px
      }

      #tooltip .tt-label {
        font-size: 10px
      }

      #tooltip .tt-cases {
        font-size: 44px
      }

      #tooltip .tt-suffix {
        font-size: 14px
      }

      .division-label {
        font-size: 17px;
        stroke-width: 4px;
        letter-spacing: 0.4px;
      }

      #header {
        padding: 8px 14px 2px;
      }

      #footer {
        padding: 2px 14px 5px;
      }

      .view-btn {
        font-size: 12px;
        padding: 7px 14px;
      }

      .legend-text {
        font-size: 12px
      }
    }
  </style>
</head>

      divisions.forEach(function (features, divName) {
        var minY = Infinity, maxY = -Infinity, sumX = 0, count = 0;
        features.forEach(function (f) {
          var b = path.bounds(f);
          var c = path.centroid(f);
          if (c[0] && c[1] && isFinite(b[0][1]) && isFinite(b[1][1])) {
            if (b[0][1] < minY) minY = b[0][1];
            if (b[1][1] > maxY) maxY = b[1][1];
            sumX += c[0];
            count++;
          }
        });
        if (count > 0) {
          var labelY = minY + (maxY - minY) * 0.33;
          svg.append("text")
            .attr("class", "division-label")
            .attr("x", sumX / count)
            .attr("y", Math.max(vbY + 14, labelY))
            .text(divName);
        }
      });

      function tooltipContent(d) {
        var p = d.properties, title, sub, val;
        if (currentView === "division") {
          title = p.dv + " Division";
          sub = "Division total";
          val = divisionTotals.get(p.dv);
        } else if (currentView === "district") {
          title = p.di + " District";
          sub = p.dv + " Division";
          val = districtTotals.get(dKey(p));
        } else {
          title = p.n;
          sub = p.di + " District &middot; " + p.dv + " Division";
          val = p.c;
        }
        return '<div class="tt-upazila">' + title + '</div>' +
          '<div class="tt-loc">' + sub + '</div>' +
          '<div class="tt-label">Reported Incidents</div>' +
          '<div><span class="tt-cases">' + val.toLocaleString() + '</span><span class="tt-suffix"> cases</span></div>';
      }

      function showTooltip(event, d) {
        tooltip.html(tooltipContent(d));
        tooltip.style("opacity", "1");
        positionTooltip(event);
      }

      function positionTooltip(event) {
        var rect = mapWrap.getBoundingClientRect();
        var ttNode = tooltip.node();
        var ttW = ttNode.offsetWidth, ttH = ttNode.offsetHeight;
        var x, y;
        if (event.touches && event.touches.length) {
          x = event.touches[0].clientX - rect.left;
          y = event.touches[0].clientY - rect.top;
        } else {
          x = event.clientX - rect.left;
          y = event.clientY - rect.top;
        }
        var left = x + 14, top = y - 10;
        if (left + ttW > rect.width - 8) left = x - ttW - 14;
        if (top + ttH > rect.height - 8) top = rect.height - ttH - 8;
        if (top < 4) top = 4;
        if (left < 4) left = 4;
        tooltip.style("left", left + "px").style("top", top + "px");
      }

      var activeFilter = null;

      function buildLegend() {
        var legend = d3.select("#legend");
        legend.style("top", "8px").style("right", "10px");

        var view = currentView;
        var buckets = bucketsByView[view];
        var unitValues = valuesByView[view];

        var n = buckets.length;
        buckets.forEach(function (b, i) {
          b.count = unitValues.filter(function (v) { return categoryFor(v, buckets) === b.key; }).length;
          // Swatch = the midpoint colour of this tier's family — exactly what the map gives
          // a value in the middle of the bucket. Keeps legend == map.
          b.color = tierColor(i)(0.5);
        });

        var titleText = view === "division" ? "Cases by Division"
          : view === "district" ? "Cases by District" : "Reported Cases";
        legend.html('<div class="legend-title">' + titleText + '</div>');

        buckets.forEach(function (b) {
          var item = legend.append("div")
            .attr("class", "legend-item" + (activeFilter === b.key ? " active" : ""))
            .on("click", function () {
              if (activeFilter === b.key) {
                activeFilter = null;
                d3.selectAll(".legend-item").classed("active", false);
                upazilas.classed("dimmed", false).classed("highlighted", false);
              } else {
                activeFilter = b.key;
                d3.selectAll(".legend-item").classed("active", false);
                d3.select(this).classed("active", true);
                upazilas
                  .classed("dimmed", function (d) { return categoryFor(valueFor(d.properties, view), buckets) !== b.key; })
                  .classed("highlighted", function (d) { return categoryFor(valueFor(d.properties, view), buckets) === b.key; });
              }
            });

          item.append("div").attr("class", "legend-swatch").style("background", b.color);
          item.append("span").attr("class", "legend-text").text(b.label);
          item.append("span").attr("class", "legend-count").text(b.count.toLocaleString());
        });
      }

      svg.on("click", function (event) {
        if (d3.select(event.target).classed("upazila")) return;
        if (isMobile()) {
          tooltip.classed("show", false);
          upazilas.classed("tapped", false);
        } else {
          tooltip.style("opacity", "0");
        }
      });

      // ---------- View switching (Upazila / District / Division) ----------
      function setView(view) {
        if (view === currentView) return;
        currentView = view;
        activeFilter = null;
        clearHighlight();
        upazilas.classed("dimmed", false).classed("highlighted", false).classed("tapped", false);
        upazilaGroup.attr("class", "upazilas-group view-" + view);
        svg.attr("class", "mode-" + view);
        var scale = scales[view];
        upazilas.transition().duration(650)
          .attr("fill", function (d) { return scale(valueFor(d.properties, view)); });
        d3.selectAll(".view-btn").classed("active", function () {
          return d3.select(this).attr("data-view") === view;
        });
        tooltip.style("opacity", "0").classed("show", false);
        buildLegend();
      }

      function buildViewToggle() {
        var vt = d3.select("#view-toggle");
        [
          { key: "upazila", label: "Upazila" },
          { key: "district", label: "District" },
          { key: "division", label: "Division" }
        ].forEach(function (v) {
          vt.append("button")
            .attr("class", "view-btn" + (v.key === currentView ? " active" : ""))
            .attr("data-view", v.key)
            .text(v.label)
            .on("click", function () { setView(v.key); });
        });
      }

      svg.attr("class", "mode-upazila");
      buildViewToggle();
      buildLegend();

      // If the input capability changes (e.g. a tablet docks a mouse), clear any open
      // tooltip / bottom-sheet so we don't get stuck in a half-state.
      function onPointerChange() {
        tooltip.style("opacity", "0").classed("show", false);
        upazilas.classed("tapped", false).classed("grp-hover", false);
      }
      if (touchQuery.addEventListener) touchQuery.addEventListener("change", onPointerChange);
      else if (touchQuery.addListener) touchQuery.addListener(onPointerChange);
    })();
  </script>
</body>
